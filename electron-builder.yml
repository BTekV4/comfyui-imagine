# Imagine as a desktop app: what electron-builder packs.
#
# `scripts/package-electron.sh` stages the tree this file packages —
#
#   build/electron/package.json   name, version, `main: main.mjs`
#   build/electron/main.mjs       the window, the server, single instance
#   build/electron/preload.cjs    the bridge the app's own pages use
#   build/electron/pages/         the splash and the failure page
#   build/electron/icon.png       the studio's own logo
#   build/electron/app/           the PROGRAM, read-only inside the package
#   build/electron/ffmpeg/        static ffmpeg and ffprobe
#
# and the app it produces keeps the two apart: `resources/app` is the program,
# the user's folder is where `config.yaml`, the media and the plugins live
# (`IMAGINE_DATA`, else the folder Electron gives an app).
appId: net.btekv.imagine
productName: Imagine
copyright: Imagine contributors

directories:
  app: build/electron
  output: release/electron
  buildResources: build/electron

# The asar holds the window's code only: everything the server reads stays in
# `resources/app`, where it can be listed and diffed against a release.
files:
  - package.json
  - main.mjs
  - preload.cjs
  - pages/**/*
  - icon.png
  # electron-builder 26.18 also searches the folders above `directories.app`
  # for node modules and packs what it finds: the project's dependencies (react,
  # react-dom, immer, yaml, fflate, scheduler — all build-time now)
  # went into the asar — 10 MB the window never imports, since the studio runs
  # from `resources/app` with a bundle of its own. The asar is the window only.
  - "!node_modules/**/*"

# `from` is relative to the project (this file's folder), not to `directories.app`.
extraResources:
  - from: build/electron/app
    to: app
  - from: build/electron/ffmpeg
    to: ffmpeg

asar: true
compression: normal

linux:
  # What the script asks for is `--dir` (the app tree); the entry stays so that
  # a plain `npx electron-builder --linux` produces something a person can
  # double-click, even though the release uses the script.
  target:
    - AppImage
  category: Graphics
  icon: icon.png
  executableName: imagine
  synopsis: A local studio for ComfyUI
  description: "Imagine — a local studio for ComfyUI: chat, images, video and a gallery, in one window."

# The AppImage is assembled by `scripts/package-electron.sh` from the tree
# electron-builder builds with `--dir`: it needs its own AppRun (one that always
# passes `--no-sandbox`, see the script) and AppImageKit's runtime glued in
# front. Nothing here builds one, which is why there is no `appImage:` section.

# Windows: one installer, double-clicked by somebody who has never opened a
# terminal. It installs for the current user — no administrator prompt, no
# folder to choose — puts an icon on the Desktop and in the Start menu, adds
# itself to "Apps & features" and leaves %APPDATA%\Imagine alone when it is
# removed. `npm run package:win` (scripts/package-electron.sh windows-x64)
# builds it; CI installs, starts, upgrades and uninstalls it before a release
# attaches it.
#
# No certificate yet, so the installer is unsigned and Windows says so the first
# time (README → "The app (Windows)"). Signing needs a paid certificate and is a
# decision of the release owner, not a line of code.
win:
  target:
    - nsis
  icon: icon.png
  executableName: Imagine
  # The file a person downloads: Imagine-<version>-windows-x64-setup.exe.
  artifactName: Imagine-${version}-windows-${arch}-setup.exe

nsis:
  # The wizard: a progress window and a "Run Imagine" checkbox, nothing else.
  oneClick: false
  # Per user: %LOCALAPPDATA%\Programs\Imagine, its uninstall entry in HKCU, and
  # no UAC prompt on a normal account.
  perMachine: false
  # Never ask for elevation — not even the "install for all users" option, so
  # the installer cannot turn into an administrator prompt halfway through.
  allowElevation: false
  # The folder is not a question this app should ask: the program goes where
  # Windows puts per-user programs, and the user's own files live elsewhere.
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Imagine
  # The page skips the "for all users / only for me" choice: per-user is the
  # only mode, and two radio buttons that say so are a question with one answer.
  include: electron/installer.nsh
  # Install over the previous version instead of beside it (the NSIS upgrade
  # path), and keep %APPDATA%\Imagine on uninstall: that folder is the
  # projects, the media, the plugins and config.yaml, not the program.
  deleteAppDataOnUninstall: false
  # The Finish page's checkbox: after install, Imagine opens.
  runAfterFinish: true
