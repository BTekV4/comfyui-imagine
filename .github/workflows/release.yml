# A tag is the release: the same typecheck and tests, then the prebuilt tarball
# (built once, attached once) — so what people download is what CI passed, and
# nobody has to build it to try the studio.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tarball:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg zip
      - run: npm ci --no-audit --no-fund
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Tarball
        run: bash scripts/release-tarball.sh
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: |
            release/comfyui-imagine-*.tar.gz
            release/comfyui-imagine-*.tar.gz.sha256
          if-no-files-found: error

  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          # Windows joins when the tests run green there (18 assertions still
          # use POSIX separators): 0.1.2. A package that was never started is
          # not attached to a release.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress
          else sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg zip; fi
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Package
        run: OUT_DIR=release bash scripts/package-portable.sh ${{ matrix.target }}
      # The check that matters: the package opens and the page answers.
      - name: Boot it
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          python -c "import zipfile,glob;zipfile.ZipFile(glob.glob('$GITHUB_WORKSPACE/release/Imagine-*-${{ matrix.target }}.zip')[0]).extractall('.')"
          cd Imagine-*-${{ matrix.target }}
          node -e "const y=require('yaml'),fs=require('fs');const c=y.parse(fs.readFileSync('config.example.yaml','utf8'));c.port=3095;fs.writeFileSync('config.yaml',y.stringify(c))"
          node dist/server.mjs > boot.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:3095/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3095/setup-status
      - uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.target }}
          path: |
            release/Imagine-*.zip
            release/Imagine-*.zip.sha256
          if-no-files-found: error

  # The desktop app: the AppImage built by electron-builder, started without a
  # screen before it is attached — a package nobody booted is not a package.
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The libraries a window needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth imagemagick libnss3 libnspr4 libgbm1 libxss1 \
            libgtk-3-0t64 libasound2t64 libcups2t64 libdrm2 libxkbcommon0 \
            libatspi2.0-0t64 libatk-bridge2.0-0t64 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 squashfs-tools
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: The AppImage
        run: OUT_DIR=release bash scripts/package-electron.sh
      - name: Boot it, twice, and close the window
        run: bash scripts/check-appimage.sh "$GITHUB_WORKSPACE"/release/Imagine-*-linux-x64.AppImage "$RUNNER_TEMP/check"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            release/Imagine-*-linux-x64.AppImage
            release/Imagine-*-linux-x64.AppImage.sha256
          if-no-files-found: error

  # The Windows installer: built by electron-builder on Windows and **installed
  # on Windows** before it is attached — silently, started, upgraded from the
  # previous version, and uninstalled, exactly as `ci.yml` does it.
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: The installer
        run: OUT_DIR=release bash scripts/package-electron.sh windows-x64
      # The upgrade the check installs over this one: the same tag's tree built
      # as the next patch version, which is what an update will be.
      - name: The next version (for the upgrade check)
        run: |
          set -euo pipefail
          NEXT=$(node -e "const v = require('./package.json').version.split('.'); v[2] = String(Number(v[2]) + 1); console.log(v.join('.'))")
          echo "the next version for the upgrade check: $NEXT"
          OUT_DIR="$(cygpath -u "$RUNNER_TEMP")/pkg-next" VERSION="$NEXT" bash scripts/package-electron.sh windows-x64
      - name: Install it, run it, upgrade it, uninstall it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem "$env:GITHUB_WORKSPACE
elease\Imagine-*-windows-x64-setup.exe" | Select-Object -First 1
          $next = Get-ChildItem "$env:RUNNER_TEMP\pkg-next\Imagine-*-windows-x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw 'the packaging step produced no installer' }
          if (-not $next) { throw 'the packaging step produced no next-version installer' }
          ./scripts/check-windows.ps1 -Installer $installer.FullName -UpgradeTo $next.FullName
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            release/Imagine-*-windows-x64-setup.exe
            release/Imagine-*-windows-x64-setup.exe.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-windows-window
          path: |
            ${{ runner.temp }}/imagine-windows-check/*.png
            ${{ runner.temp }}/imagine-windows-check/*.json
            ${{ runner.temp }}/imagine-windows-check/imagine.log
          if-no-files-found: warn

  publish:
    needs: [tarball, portable, desktop, windows-desktop]
    timeout-minutes: 15
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-artifacts/**
          fail_on_unmatched_files: true
          body: |
            **Choose your system, download, double-click.** Node and ffmpeg are
            inside the packages: nothing else to install.

            | Your system | Download | Then |
            |---|---|---|
            | Linux (64-bit) | `Imagine-<version>-linux-x64.AppImage` | double-click it: imagine opens in its own window |
            | Linux, or a folder you keep | `Imagine-<version>-linux-x64.zip` | extract, run **Imagine.sh** |
            | Windows (64-bit) | `Imagine-<version>-windows-x64-setup.exe` | double-click it: the installer puts Imagine on the Desktop and in the Start menu, then opens it |
            | macOS, or a server | `comfyui-imagine-<version>.tar.gz` | `tar xzf … && ./install.sh` |

            The Windows installer is **per user**: it does not ask for an
            administrator, puts the program in `%LOCALAPPDATA%\Programs\Imagine`
            and your data in `%APPDATA%\Imagine`. Uninstalling it (Windows
            Settings → **Apps**) removes the program and its shortcuts and
            leaves your configuration, projects and media where they are;
            installing a new version over the old one does the same thing the
            other way round.

            **It is not signed yet**, so the first time Windows SmartScreen says
            *"Windows protected your PC"*: click **More info** (or "Ulteriori
            informazioni") and then **Run anyway** ("Esegui comunque"). A
            certificate is a purchase, not a code change.

            The Linux AppImage is the studio as an **app**: its own window, its
            own icon in the menu, no browser and no terminal. Closing the window
            stops it, a second double-click brings the open window to the front,
            and the app updates by replacing the file — the data (configuration,
            projects, media, plugins) lives in your home folder and stays.

            The zips carry **Node 24** and a static **ffmpeg**: the launcher opens
            the browser by itself, and a second double-click just reopens the page
            instead of starting a second copy.

            **What you need anyway:** a **ComfyUI** the studio can reach (the zip
            assumes `127.0.0.1:8188`) and its weights — the first request that
            needs them offers to download them (about 22.6 GB for the image
            actions, 76–88 GB for video). The studio never downloads anything
            before you say yes.

            On the first start there is no configuration to write: the studio
            creates one, and the home page shows a **first-run card** with what
            is still missing (ComfyUI not answering, no model, no ffmpeg) and the
            command or setting that fixes each row. The text model and the
            ComfyUI address are set from that card and from **Settings**.

            The one manual step: copy the node pack into ComfyUI, once —

            ```sh
            # Windows: xcopy /E /I comfyui-nodes\comfyui-imagine C:\ComfyUI\custom_nodes\comfyui-imagine
            cp -r comfyui-nodes/comfyui-imagine <ComfyUI>/custom_nodes/
            ```

            See the [README](https://github.com/BTekV4/comfyui-imagine#start-here).
