# Rehearses a release without a tag and without writing one: the file list the
# publish job checks, and the portable package when ffmpeg's usual mirror
# answers with a page instead of the archive. Nothing here tags, pushes or
# publishes; it is run by hand before a release.
#
#   gh workflow run release-dry-run.yml --ref <branch>
name: Release dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The gate the publish job runs, fed both lists: the eight files a release is
  # made of, and the eleven files the v0.3.0 release attached by mistake.
  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The packages and their digests are accepted
        run: |
          set -euo pipefail
          mkdir packages
          for name in \
            comfyui-imagine-0.4.0.tar.gz comfyui-imagine-0.4.0.tar.gz.sha256 \
            Imagine-0.4.0-linux-x64.zip Imagine-0.4.0-linux-x64.zip.sha256 \
            Imagine-0.4.0-linux-x64.AppImage Imagine-0.4.0-linux-x64.AppImage.sha256 \
            Imagine-0.4.0-windows-x64-setup.exe Imagine-0.4.0-windows-x64-setup.exe.sha256; do
            : > "packages/$name"
          done
          bash scripts/check-release-assets.sh packages | tee list.txt
          test "$(tail -n +2 list.txt | wc -l)" -eq 8
      - name: The Windows check's files are refused
        run: |
          set -euo pipefail
          cp -a packages rejected
          for name in imagine.log selftest-close.json selftest-fresh.json \
            selftest-paths.json selftest-previous.json selftest-upgraded.json \
            window-close.png window-fresh.png window-paths.png window-previous.png \
            window-upgraded.png; do
            : > "rejected/$name"
          done
          if bash scripts/check-release-assets.sh rejected; then
            echo "::error::the gate accepted the files v0.3.0 attached by mistake"
            exit 1
          fi
          echo "refused, as it must be"
      - name: A package without its digest is refused
        run: |
          set -euo pipefail
          cp -a packages nodigest
          rm nodigest/Imagine-0.4.0-linux-x64.zip.sha256
          if bash scripts/check-release-assets.sh nodigest; then
            echo "::error::the gate accepted a package with no digest"
            exit 1
          fi
          echo "refused, as it must be"

  # The portable package when johnvansickle answers with a page: the three
  # attempts of the script are made to fail, the fallback builds the package,
  # and the zip must stay in the 113 MB class instead of the 195 MB of v0.3.0.
  portable-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the portable package with ffmpeg's mirror broken
        run: |
          set -euo pipefail
          # example.invalid answers nothing, so every attempt fails and the
          # fallback is what runs.
          FFMPEG_LINUX_URL=https://example.invalid/ffmpeg.tar.xz \
            OUT_DIR="$PWD/release" bash scripts/package-portable.sh linux-x64
      - name: The package is the small one
        run: |
          set -euo pipefail
          zip=$(ls release/Imagine-*-linux-x64.zip)
          size=$(stat -c %s "$zip")
          echo "the zip is $size bytes"
          # v0.3.0, with the 176 MB-per-binary fallback, was 194 747 839 bytes;
          # John Van Sickle's 79 MB binaries make a package of about 113 MB.
          if [ "$size" -gt 140000000 ]; then
            echo "::error::the ffmpeg fallback doubled the package: $size bytes"
            exit 1
          fi
          python3 - "$zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              for info in z.infolist():
                  if "/runtime/ffmpeg/" in info.filename:
                      print(f"{info.filename}: {info.file_size} bytes")
                      assert info.file_size < 100_000_000, "the fallback is the big build"
          PY
          tree=$(ls -d release/Imagine-*-linux-x64)
          "$tree/runtime/ffmpeg/ffmpeg" -version | head -1
          "$tree/runtime/ffmpeg/ffprobe" -version | head -1
