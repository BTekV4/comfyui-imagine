# Everything the project promises in one place: the types check, the tests
# pass, the page and the server build. Runs on every push and pull request, on
# the Node the project requires.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # A branch can be checked before it is a pull request:
  # `gh workflow run ci.yml --ref <branch>`. The Windows job takes long enough
  # that waiting for a pull request is worse than asking for the run.
  workflow_dispatch:
    inputs:
      release_rehearsal:
        description: "Rehearse the release file list and the ffmpeg fallback (writes no release)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Some tests and every video path shell out to these; without them the
      # suite is not testing what it claims to.
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      # The tests never boot the built server: this starts it for real and
      # asks the page, the health route and the first-run report to answer.
      - name: Boot it
        run: node scripts/smoke-server.mjs
        env:
          IMAGINE_SMOKE_REQUIRE_FFMPEG: '1'

  # Windows is where most people who use ComfyUI are: here the types, the
  # tests, the build and the boot run on the packaging platform itself, and the
  # **installer** is built and really installed — silently, started, closed,
  # upgraded and uninstalled. `scripts/check-windows.ps1` is the counterpart of
  # `check-appimage.sh`: a package nobody booted is not a package.
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - run: npm ci --no-audit --no-fund
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      # The boot is where config paths, the data folder and the web build meet
      # the real filesystem: on Windows a server that never answers is the
      # first thing a user would meet, so CI starts it here.
      - name: Boot it
        run: node scripts/smoke-server.mjs
        env:
          IMAGINE_SMOKE_REQUIRE_FFMPEG: '1'
      # The installer the release attaches, built by electron-builder on the
      # platform it installs on.
      - name: Package the Windows installer
        run: OUT_DIR="$(cygpath -u "$RUNNER_TEMP")/pkg" bash scripts/package-electron.sh windows-x64
      # The update a real version does needs two of them: the same commit built
      # as the next patch version, installed over this one by the check.
      - name: Package the next version (for the upgrade check)
        run: |
          set -euo pipefail
          NEXT=$(node -e "const v = require('./package.json').version.split('.'); v[2] = String(Number(v[2]) + 1); console.log(v.join('.'))")
          echo "the next version for the upgrade check: $NEXT"
          OUT_DIR="$(cygpath -u "$RUNNER_TEMP")/pkg-next" VERSION="$NEXT" bash scripts/package-electron.sh windows-x64
      # Install it the way a person does (double-click → silent here), start
      # the installed exe, look at the window, restart the studio, upgrade,
      # uninstall — see the script for what each step proves.
      - name: Install it, run it, upgrade it, uninstall it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem "$env:RUNNER_TEMP\pkg\Imagine-*-windows-x64-setup.exe" | Select-Object -First 1
          $next = Get-ChildItem "$env:RUNNER_TEMP\pkg-next\Imagine-*-windows-x64-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw 'the packaging step produced no installer' }
          if (-not $next) { Write-Warning 'no next-version installer: the upgrade check is skipped' }
          $upgrade = if ($next) { $next.FullName } else { '' }
          ./scripts/check-windows.ps1 -Installer $installer.FullName -UpgradeTo $upgrade
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-installer
          path: |
            ${{ runner.temp }}/pkg/Imagine-*-windows-x64-setup.exe
            ${{ runner.temp }}/pkg/Imagine-*-windows-x64-setup.exe.sha256
            ${{ runner.temp }}/pkg-next/Imagine-*-windows-x64-setup.exe
            ${{ runner.temp }}/pkg-next/Imagine-*-windows-x64-setup.exe.sha256
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-window
          path: |
            ${{ runner.temp }}/imagine-windows-check/*.png
            ${{ runner.temp }}/imagine-windows-check/*.json
            ${{ runner.temp }}/imagine-windows-check/imagine.log
          if-no-files-found: warn

  # The desktop app (Electron) is built and **started without a screen**: the
  # check is not "the process is alive" but "the window loaded the studio".
  # `scripts/check-appimage.sh` starts it on Xvfb, keeps a screenshot, looks at
  # what the window reports, launches it twice and closes the window to see
  # that the server goes with it.
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Electron needs the GTK/NSS/GBM libraries, Xvfb a virtual screen and
      # ImageMagick the screenshot. None of them ship on the runner image.
      - name: The libraries a window needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth imagemagick libnss3 libnspr4 libgbm1 libxss1 \
            libgtk-3-0t64 libasound2t64 libcups2t64 libdrm2 libxkbcommon0 \
            libatspi2.0-0t64 libatk-bridge2.0-0t64 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 squashfs-tools
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Package the AppImage
        run: OUT_DIR="$RUNNER_TEMP/pkg" bash scripts/package-electron.sh
      - name: Start it without a screen and look at the window
        run: bash scripts/check-appimage.sh "$RUNNER_TEMP"/pkg/Imagine-*-linux-x64.AppImage "$RUNNER_TEMP/check"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-window
          path: |
            ${{ runner.temp }}/check/window.png
            ${{ runner.temp }}/check/selftest.json
            ${{ runner.temp }}/check/data/logs/imagine.log
            ${{ runner.temp }}/check/app.log
          if-no-files-found: warn

  # The portable package is built and really started: if the launcher or the
  # runtime PATH breaks, it shows up here and not in the release.
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Package
        run: OUT_DIR="$RUNNER_TEMP/pkg" bash scripts/package-portable.sh linux-x64
      - name: Boot it
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          unzip -q "$RUNNER_TEMP"/pkg/Imagine-*-linux-x64.zip
          cd Imagine-*-linux-x64
          node -e "const y=require('yaml'),fs=require('fs');const c=y.parse(fs.readFileSync('config.example.yaml','utf8'));c.port=3095;fs.writeFileSync('config.yaml',y.stringify(c))"
          setsid ./Imagine.sh > boot.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3095/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3095/setup-status

  # The publish job's steps, run without a tag and without writing anything:
  # the packages downloaded by name into `dist-artifacts` (the folder the
  # publish job gates on), the gate itself on that folder, and the portable
  # package built with ffmpeg's mirror broken (the 0.3.0 zip doubled to 195 MB
  # when that fallback ran).
  # `gh workflow run ci.yml --ref <branch> -f release_rehearsal=true`.
  #
  # A missing `actions/checkout` cannot be caught by running the steps: this
  # job has a checkout of its own, which is why v0.3.1's publish got past it.
  # `test/release-workflow.test.ts` reads release.yml instead and refuses a job
  # that runs a repository script before checking the repository out; the
  # `check` job runs it on every push and pull request, so the next one of
  # these shows up before a tag exists.
  release-rehearsal:
    if: inputs.release_rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The publish job checks the repository out before its gate
        run: node --experimental-transform-types --test test/release-workflow.test.ts
      - name: The packages and their digests are accepted
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # The same folder and the same command as release.yml's publish job.
          mkdir dist-artifacts
          for name in \
            "comfyui-imagine-$version.tar.gz" "comfyui-imagine-$version.tar.gz.sha256" \
            "Imagine-$version-linux-x64.zip" "Imagine-$version-linux-x64.zip.sha256" \
            "Imagine-$version-linux-x64.AppImage" "Imagine-$version-linux-x64.AppImage.sha256" \
            "Imagine-$version-windows-x64-setup.exe" "Imagine-$version-windows-x64-setup.exe.sha256"; do
            : > "dist-artifacts/$name"
          done
          bash scripts/check-release-assets.sh dist-artifacts | tee list.txt
          test "$(tail -n +2 list.txt | wc -l)" -eq 8
      - name: The Windows check's files are refused
        run: |
          set -euo pipefail
          cp -a dist-artifacts rejected
          for name in imagine.log selftest-close.json selftest-fresh.json \
            selftest-paths.json selftest-previous.json selftest-upgraded.json \
            window-close.png window-fresh.png window-paths.png window-previous.png \
            window-upgraded.png; do
            : > "rejected/$name"
          done
          if bash scripts/check-release-assets.sh rejected; then
            echo "::error::the gate accepted the files v0.3.0 attached by mistake"
            exit 1
          fi
          echo "refused, as it must be"
      - name: A package without its digest is refused
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          cp -a dist-artifacts nodigest
          rm "nodigest/Imagine-$version-linux-x64.zip.sha256"
          if bash scripts/check-release-assets.sh nodigest; then
            echo "::error::the gate accepted a package with no digest"
            exit 1
          fi
          echo "refused, as it must be"
      - name: Build the portable package with ffmpeg's mirror broken
        run: |
          set -euo pipefail
          # example.invalid answers nothing, so every attempt fails and the
          # fallback is what builds the package.
          FFMPEG_LINUX_URL=https://example.invalid/ffmpeg.tar.xz \
            OUT_DIR="$PWD/release" bash scripts/package-portable.sh linux-x64
      - name: The package is the small one
        run: |
          set -euo pipefail
          zip=$(ls release/Imagine-*-linux-x64.zip)
          size=$(stat -c %s "$zip")
          echo "the zip is $size bytes"
          # v0.3.0, with the 176 MB-per-binary fallback, was 194 747 839 bytes;
          # John Van Sickle's 79 MB binaries make a package of about 113 MB.
          if [ "$size" -gt 140000000 ]; then
            echo "::error::the ffmpeg fallback doubled the package: $size bytes"
            exit 1
          fi
          python3 - "$zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              maps = [info.filename for info in z.infolist() if info.filename.endswith(".map")]
              assert not maps, f"source maps in the package: {maps[:3]}"
              for info in z.infolist():
                  if "/runtime/ffmpeg/" in info.filename:
                      print(f"{info.filename}: {info.file_size} bytes")
                      assert info.file_size < 100_000_000, "the fallback is the big build"
          PY
          tree=$(ls -d release/Imagine-*-linux-x64)
          "$tree/runtime/ffmpeg/ffmpeg" -version | head -1
          "$tree/runtime/ffmpeg/ffprobe" -version | head -1

  # The history is public, and a key committed once stays in it after the file
  # is deleted: the scan looks at every commit, not only this checkout. The
  # binary is pinned by version and checked against its release checksum; no
  # paid licence is involved (gitleaks-action would need one for organisations).
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit, since that is what the scan has to look at.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          BASE=https://github.com/gitleaks/gitleaks/releases/download/v$VERSION
          curl -sSfL -o "gitleaks_${VERSION}_linux_x64.tar.gz" "$BASE/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "$BASE/gitleaks_${VERSION}_checksums.txt"
          grep " gitleaks_${VERSION}_linux_x64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks version
      - name: Scan the history
        run: ./gitleaks git --no-banner --redact --verbose --config .gitleaks.toml .
