<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:" />
    <title>Imagine</title>
    <style>
      /* The studio's own colours (`web/tokens.css`), so the few seconds before
         the page arrives do not look like another program. */
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; background: #141414; color: #fafafa;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      .mark { width: 84px; height: 84px; border-radius: 22px; background: #1b1b1b; border: 1px solid rgb(255 255 255 / 0.08);
        display: grid; place-items: center; font: 600 40px/1 inherit; color: #3b6cf6; }
      h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.2px; }
      .note { color: #a1a1a1; font-size: 13px; }
      .bar { width: 220px; height: 3px; border-radius: 2px; background: #242424; overflow: hidden; }
      .bar span { display: block; width: 40%; height: 100%; background: #3b6cf6; border-radius: 2px;
        animation: slide 1.3s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
      @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">I</div>
      <h1>Imagine</h1>
      <div class="bar"><span></span></div>
      <p class="note">Starting the studio…</p>
    </main>
  </body>
</html>
