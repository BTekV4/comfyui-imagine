<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Imagine</title>
    <style>
      /* The studio's colours (`web/tokens.css`): a failure is still the app. */
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; background: #141414; color: #fafafa;
        font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      main { max-width: 820px; margin: 0 auto; padding: 48px 32px 40px; box-sizing: border-box; min-height: 100%;
        display: flex; flex-direction: column; gap: 18px; }
      .head { display: flex; align-items: center; gap: 14px; }
      .mark { width: 44px; height: 44px; border-radius: 12px; background: #1b1b1b; border: 1px solid rgb(255 255 255 / 0.08);
        display: grid; place-items: center; font-size: 22px; font-weight: 600; color: #3b6cf6; flex: none; }
      h1 { margin: 0; font-size: 20px; font-weight: 600; }
      .message { color: #fafafa; font-size: 15px; }
      .hint { color: #a1a1a1; font-size: 14px; border-left: 2px solid #3b6cf6; padding-left: 12px; }
      .paths { color: #8a8a8a; font-size: 12.5px; font-family: ui-monospace, monospace; word-break: break-all; }
      pre { margin: 0; flex: 1 1 auto; min-height: 120px; max-height: 46vh; overflow: auto; background: #1b1b1b;
        border: 1px solid rgb(255 255 255 / 0.08); border-radius: 10px; padding: 14px; color: #cfcfcf;
        font: 12.5px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; }
      button { font: inherit; font-size: 14px; padding: 9px 16px; border-radius: 9px; cursor: pointer;
        border: 1px solid rgb(255 255 255 / 0.12); background: #242424; color: #fafafa; }
      button:hover { background: #303030; }
      button.primary { background: #3b6cf6; border-color: #3b6cf6; color: #fff; }
      button.primary:hover { filter: brightness(1.08); }
      .empty { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="head">
        <div class="mark">I</div>
        <h1 id="title">Imagine could not start</h1>
      </div>
      <p class="message" id="message"></p>
      <p class="hint empty" id="hint"></p>
      <p class="paths">Log: <span id="log"></span><br />Data: <span id="data"></span></p>
      <pre id="detail" class="empty"></pre>
      <div class="actions">
        <button class="primary" id="restart">Try again</button>
        <button id="logs">Open log folder</button>
        <button id="dataButton">Open data folder</button>
        <button id="quit">Quit</button>
      </div>
    </main>
    <script>
      // Everything below is the app's own text, taken from the query the main
      // process wrote: no markup is interpreted, only text.
      const params = new URLSearchParams(location.search)
      const text = (id, value) => {
        const node = document.getElementById(id)
        if (value === null || value === '') return
        node.textContent = value
        node.classList.remove('empty')
      }
      text('title', params.get('title'))
      text('message', params.get('message'))
      text('hint', params.get('hint'))
      text('detail', params.get('detail'))
      text('log', params.get('log'))
      text('data', params.get('data'))
      const act = (name) => {
        if (window.imagine !== undefined) window.imagine.action(name)
      }
      document.getElementById('restart').addEventListener('click', () => act('restart'))
      document.getElementById('logs').addEventListener('click', () => act('logs'))
      document.getElementById('dataButton').addEventListener('click', () => act('data'))
      document.getElementById('quit').addEventListener('click', () => act('quit'))
    </script>
  </body>
</html>
