# Imagine — example configuration.
#
# Copy to config.yaml (or point IMAGINE_CONFIG at it) and fill in your own
# values. Nothing here is secret: API keys are read from the environment
# variable each provider names, so this file can be committed.
#
# Every path is read relative to THIS FILE, so the app can be started from
# anywhere.

port: 3090
host: 0.0.0.0
# The language the server writes in when the page does not say (notices,
# errors of background work): en or it. The page itself follows the browser.
language: en
# Built by `npm run build`.
webDir: ./dist/web

# Login: the password is hashed into this file on first run.
passwordFile: ./data/password.json
secretFile: ./data/cookie-secret

# ---------------------------------------------------------------------------
# LLM providers: anything that speaks the OpenAI chat-completions shape.
# ---------------------------------------------------------------------------
providers:
  local:
    baseURL: http://127.0.0.1:11434/v1     # Ollama, vLLM, LM Studio, llama.cpp…
    apiKeyEnv: LOCAL_API_KEY               # optional: omit for a keyless server
    # How long one call may stay SILENT before it is given up: no byte
    # received, not a deadline on the answer. Every delta — reasoning
    # included — pushes it back, so a model that keeps working is never
    # interrupted, however long it thinks (the studio puts no other clock on
    # a model call: see the note in server/src/llm.ts). Raise it for a
    # provider that thinks a long time before its first token. Absent or 0
    # means the built-in ten minutes.
    timeoutMs: 600000
  openai:
    baseURL: https://api.openai.com/v1
    apiKeyEnv: OPENAI_API_KEY

# The models the composer offers. The default model also reads the pictures and
# the clip frames, so pick one with image input.
models:
  - provider: local
    id: qwen3-vl:8b
    name: Qwen3-VL 8B
  - provider: openai
    id: gpt-4o-mini
    name: GPT-4o mini

defaultModel:
  provider: local
  model: qwen3-vl:8b

# ---------------------------------------------------------------------------
# ComfyUI
# ---------------------------------------------------------------------------
comfy:
  baseURL: http://127.0.0.1:8188
  pathStyle: auto          # auto | absolute | relative
  timeoutMs: 2700000

# ---------------------------------------------------------------------------
# The studio: where files land, which graphs back which action, who it draws.
# Every entry under `workflows` is optional: an action whose graph is missing
# simply reports that it is not configured.
# ---------------------------------------------------------------------------
toolComfy:
  outputDir: ./data/outputs

  # Who the prompts describe. See persona/example.json for the shape.
  persona:
    path: ./persona/example.json

  # Text to speech, for the `speak` action (OpenAI-shaped speech API).
  # tts:
  #   baseURL: http://127.0.0.1:8880/v1
  #   model: kokoro
  #   voice: af_heart
  #   format: mp3

  # One entry per action. `path` is an API-format graph (ComfyUI "Save (API
  # format)"); the other fields pin the node ids the studio writes on every
  # run. The ids below match the graphs shipped in ./workflows/: if you edit a
  # graph or bring your own, update them. `highInputs`, where present, lists
  # the inputs written over the same graph when the job asks for high quality
  # (or slow speed); `pathHigh` instead names a second graph for that recipe,
  # with the same pins. See workflows/README.md for what each graph does.
  workflows:
    # ---------------------------------------------------------------- images

    # Text to image (Krea 2). Prompt, seed and canvas pins; `steps.high` is the
    # sampler step count used for "Quality: high" (the graph is saved at 8).
    generateImage:
      path: ./workflows/comfyui_generazione_krea2_API.json
      description: "When to use it: draw a new photo from a sentence."
      outputExt: png
      promptNodeId: "73"
      seedNodeId: "53"
      sizeNodeId: "52"
      steps:
        nodeId: "53"
        field: steps
        high: 16

    # The opening frame a "recreate" redraws from the reference clip's
    # description. Any text-to-image graph works; here the same Krea 2 graph.
    recreateFrame:
      path: ./workflows/comfyui_generazione_krea2_API.json
      description: "When to use it: the opening frame a “recreate video” redraws before it shoots the scene again."
      outputExt: png
      promptNodeId: "73"
      seedNodeId: "53"
      sizeNodeId: "52"
      steps:
        nodeId: "53"
        field: steps
        high: 16

    # Image to image (the "remix" action): an anchored Krea 2 edit.
    editImage:
      path: ./workflows/comfyui_edit_krea2_API.json
      description: "When to use it: change a photo from an instruction; the whole picture is redrawn."
      # The «+» reference photo: a second image Krea 2 reads; without one these two nodes are taken out.
      refImageNodeId: "77"
      refEncodeNodeId: "78"
      outputExt: png
      promptNodeId: "500"
      steps:
        nodeId: "307"
        field: steps
        high: 16

    # The same edit confined to a zone the user marked: the mask goes into the
    # `lastImageNodeId` node, and pixels outside it stay the source's own.
    editImageRegion:
      path: ./workflows/comfyui_edit_krea2_region_API.json
      description: "When to use it: change only a marked zone of a photo and leave the rest untouched."
      # The «+» reference photo: a second image Krea 2 reads; without one these two nodes are taken out.
      refImageNodeId: "77"
      refEncodeNodeId: "78"
      outputExt: png
      promptNodeId: "500"
      seedNodeId: "307"
      imageNodeId: "76"
      lastImageNodeId: "600"
      steps:
        nodeId: "307"
        field: steps
        high: 16

    # "Compose with references" (Qwen-Image 2.1): two photos, the person and a
    # reference (outfit, setting), into one. The prompt node is the encoder.
    composeRefs:
      path: ./workflows/qwen_compose_refs_API.json
      description: "When to use it: put a person or an object into another photo’s outfit, pose or setting."
      outputExt: png
      promptNodeId: "6"
      imageNodeId: "4"
      lastImageNodeId: "5"

    # "Relight the photo" (FLUX.3 Klein): the text is the chosen lighting look.
    # The graph derives its canvas from the photo, so there is no sizeNodeId.
    relight:
      path: ./workflows/comfyui_edit_flux3_relight_API.json
      description: "When to use it: light a photo with one of the studio’s light looks."
      outputExt: png
      promptNodeId: "500"
      promptField: text
      seedNodeId: "19"
      seedField: seed
      imageNodeId: "9"

    # Image upscale (SeedVR2, 4K).
    upscaleImage:
      path: ./workflows/SeedVR2_4K_image_upscale.json
      description: "When to use it: raise a still to a larger size without redrawing it."
      outputExt: png
      imageNodeId: "16"
      seedNodeId: "10"

    # Background removal (BiRefNet), the "bg" action.
    removeBackground:
      path: ./workflows/utility_birefnet_remove_background.json
      description: "When to use it: cut a subject out of a photo."
      outputExt: png
      imageNodeId: "22"

    # ---------------------------------------------------------------- video
    # The clip graphs below use MiniMax H3 with the Pika LoRA. Each Pika graph
    # carries both recipes: as saved it is the fast one (turbo LoRA, 4 steps,
    # euler); `highInputs` lists the inputs the quality recipe ("Velocita:
    # Lenta" / "Qualita: Alta") writes over it (full LoRA, the 6-step sigma
    # list of `pika:sigmas`, lcm). A value written as [node, output] rewires
    # that input; the nodes a recipe leaves unread are dropped from its run.
    # `pathHigh: <file>` (a second graph with the same pins) is still accepted
    # in place of `highInputs`.
    # `realism` is the optional realism LoRA node: its strength and trigger
    # word are applied when a job asks for it.

    # Image to video. `lastImageNodeId` is the optional end frame: without one
    # the studio unlinks it.
    createVideo:
      path: ./workflows/comfyui_video_i2v_pika_API.json
      description: "When to use it: animate one photo as a single take of a few seconds."
      highInputs:
        - { nodeId: "pika:lora", field: lora_name, value: pika_h3_flex_fl2va_v1_bf16.safetensors }
        - { nodeId: "105:17", field: sampler_name, value: lcm }
        - { nodeId: "105:14", field: sigmas, value: ["pika:sigmas", 0] }
        - { nodeId: "105:143", field: shift_video, value: 12 }
      outputExt: mp4
      promptNodeId: "105:104"
      promptField: prompt
      imageNodeId: "1682:114"
      lastImageNodeId: "9001"
      lastFrameNodeId: "105:104"
      seedNodeId: "105:15"
      seedField: noise_seed
      sizeNodeId: "105:104"
      aspectRatio:
        nodeId: "1682:115"
        field: aspect_ratio
      seconds:
        nodeId: "105:111"
        field: value
      realism:
        nodeId: "1682:200"
        field: strength_model
        strength: 1.25
        token: r34l1sm

    # The same action past six seconds (with no last frame): the Context Loop's
    # I2V chain, Openjutsu's way. One scene of at most 6 s after the other, each
    # starting from the last frames of the one before, a checkpoint per scene,
    # the scenes joined inside ComfyUI. The studio writes one prompt per scene
    # (planJson) and the run name the checkpoints go under (runName). Same model
    # and LoRAs as the Pika fast graph.
    createVideoChain:
      path: ./workflows/comfyui_video_i2v_chain_API.json
      description: "When to use it: animate one photo past six seconds, scene after scene."
      outputExt: mp4
      imageNodeId: "27"
      promptNodeId: ip
      promptField: value
      seedNodeId: "24"
      seedField: base_seed
      sizeNodeId: "24"
      planJson:
        nodeId: "24"
        field: plan_json
      runName:
        nodeId: "24"
        field: run_name
      realism:
        nodeId: real
        field: strength_model
        strength: 1.25
        token: r34l1sm

    # The clip a "recreate" renders from its redrawn opening frame. Left out,
    # recreate uses createVideo; here it is the same graph, spelt out.
    recreateVideo:
      path: ./workflows/comfyui_video_i2v_pika_API.json
      description: "When to use it: shoot an existing clip again from a redrawn first frame."
      highInputs:
        - { nodeId: "pika:lora", field: lora_name, value: pika_h3_flex_fl2va_v1_bf16.safetensors }
        - { nodeId: "105:17", field: sampler_name, value: lcm }
        - { nodeId: "105:14", field: sigmas, value: ["pika:sigmas", 0] }
        - { nodeId: "105:143", field: shift_video, value: 12 }
      outputExt: mp4
      promptNodeId: "105:104"
      promptField: prompt
      imageNodeId: "1682:114"
      lastImageNodeId: "9001"
      lastFrameNodeId: "105:104"
      seedNodeId: "105:15"
      seedField: noise_seed
      sizeNodeId: "105:104"
      aspectRatio:
        nodeId: "1682:115"
        field: aspect_ratio
      seconds:
        nodeId: "105:111"
        field: value
      realism:
        nodeId: "1682:200"
        field: strength_model
        strength: 1.25
        token: r34l1sm

    # Animated background (the "loop" action): the graph wraps the latent's end
    # onto its start, so the clip comes back periodic; the photo is a
    # reference, not a pinned first frame.
    loopVideo:
      path: ./workflows/comfyui_video_loop_pika_API.json
      description: "When to use it: make a short seamless animated background from one photo."
      highInputs:
        - { nodeId: "pika:lora", field: lora_name, value: pika_h3_flex_ref2va_v1_bf16.safetensors }
        - { nodeId: "105:17", field: sampler_name, value: lcm }
        - { nodeId: "105:14", field: sigmas, value: ["pika:sigmas", 0] }
      outputExt: mp4
      promptNodeId: "105:104"
      promptField: prompt
      imageNodeId: "1682:114"
      seedNodeId: "105:15"
      seedField: noise_seed
      aspectRatio:
        nodeId: "1682:115"
        field: aspect_ratio
      seconds:
        nodeId: "105:111"
        field: value
      realism:
        nodeId: "1682:200"
        field: strength_model
        strength: 1.25
        token: r34l1sm

    # A background past six seconds: the Context Loop's chain of scenes of at
    # most 6 s; a core switch gives the LAST scene the still as its last frame,
    # and the studio then dissolves the tail over the head like the old chain.
    loopVideoChain:
      path: ./workflows/comfyui_video_loop_chain_API.json
      description: "When to use it: the same background past six seconds, joined into a loop."
      outputExt: mp4
      imageNodeId: "27"
      promptNodeId: ip
      promptField: value
      seedNodeId: "24"
      seedField: base_seed
      sizeNodeId: "24"
      planJson:
        nodeId: "24"
        field: plan_json
      runName:
        nodeId: "24"
        field: run_name
      realism:
        nodeId: real
        field: strength_model
        strength: 1.25
        token: r34l1sm

    # Continue an existing clip (the "extend" action): the tail of the clip
    # goes into the video node.
    extendVideo:
      path: ./workflows/comfyui_video_extend_pika_API.json
      description: "When to use it: continue an existing clip for a few seconds."
      highInputs:
        - { nodeId: "pika:lora", field: lora_name, value: pika_h3_flex_fl2va_v1_bf16.safetensors }
        - { nodeId: "1682:135", field: sampler_name, value: lcm }
        - { nodeId: "1682:125", field: sigmas, value: ["pika:sigmas", 0] }
        # The quality recipe reads the LoRA chain without the 4-step shift.
        - { nodeId: "pika:lora", field: model, value: ["1682:200", 0] }
      outputExt: mp4
      promptNodeId: "1682:131"
      promptField: prompt
      seedNodeId: "1682:129"
      seedField: noise_seed
      videoNodeId: "1682:300"
      videoField: file
      sizeNodeId: "1682:131"
      aspectRatio:
        nodeId: "1682:115"
        field: aspect_ratio
      seconds:
        nodeId: "1682:133"
        field: value
      realism:
        nodeId: "1682:200"
        field: strength_model
        strength: 1.25
        token: r34l1sm

    # The continuation past six seconds: the Context Loop's external-video
    # chain. The whole clip is the first scene's context and is laid in front of
    # the new scenes inside ComfyUI, so the studio does not join anything; each
    # scene is at most 6 s and continues the one before, with a checkpoint each.
    extendVideoChain:
      path: ./workflows/comfyui_video_extend_chain_API.json
      description: "When to use it: continue an existing clip past six seconds."
      outputExt: mp4
      videoNodeId: src
      videoField: file
      promptNodeId: ip
      promptField: value
      seedNodeId: "24"
      seedField: base_seed
      sizeNodeId: "24"
      planJson:
        nodeId: "24"
        field: plan_json
      runName:
        nodeId: "24"
        field: run_name
      realism:
        nodeId: real
        field: strength_model
        strength: 1.25
        token: r34l1sm

    # A clip that sings a given track: the song slice is anchored at a frame
    # (MiniMaxH3AddGuide), so the mouth follows the song. `chain` pins the
    # nodes that carry one shot into the next. An optional `lipsync` block
    # ({ probe: <script>, min, retries }) re-renders shots whose mouth does not
    # follow the song; it needs a probe script of your own, so it is left out.
    videoOnSong:
      path: ./workflows/comfyui_video_song_pika_API.json
      description: "When to use it: sing a track it is given, for a video cut to a song."
      highInputs:
        - { nodeId: "pika:lora", field: lora_name, value: pika_h3_flex_ref2va_v1_bf16.safetensors }
        - { nodeId: "1682:135", field: sampler_name, value: lcm }
        - { nodeId: "1682:125", field: sigmas, value: ["pika:sigmas", 0] }
      outputExt: mp4
      promptNodeId: "1682:131"
      promptField: prompt
      imageNodeId: "1682:114"
      seedNodeId: "1682:129"
      seedField: noise_seed
      aspectRatio:
        nodeId: "1682:115"
        field: aspect_ratio
      seconds:
        nodeId: "1682:133"
        field: value
      realism:
        nodeId: "1682:200"
        field: strength_model
        strength: 1.25
        token: r34l1sm
      songAudio:
        nodeId: "1682:400"
        field: audio
      songStart:
        nodeId: "1682:401"
        field: start_index
      songDuration:
        nodeId: "1682:401"
        field: duration
      songFrame:
        nodeId: "1682:402"
        field: frame_idx
      songPrerollStart:
        nodeId: "1682:602"
        field: start_index
      songPrerollDuration:
        nodeId: "1682:602"
        field: duration
      chain:
        loadNodeId: "1682:501"
        saveNodeId: "1682:500"

    # "Edit object": Openjutsu's object graph, one file per mode. It plans the
    # clip in 6 s clips with 39 frames of overlap, renders and joins them itself
    # (MiniMaxH3ChainLoopStart) with a checkpoint per clip, so the whole video
    # goes in one prompt and a rerun resumes from the last finished clip.
    # subjectText is what SAM follows (for background: what stays), referenceText
    # what it becomes (for remove: what shows instead); planResolution takes
    # «480p» from the composer's lower step, else the graph's 736p.

    # Mode "change": the tracked object is replaced (optionally from a photo).
    objectSwap:
      path: ./workflows/comfyui_video_object_swap_API.json
      description: "When to use it: replace an object in a clip with the object of a photo."
      outputExt: mp4
      imageNodeId: "2"
      videoNodeId: "5"
      videoField: video
      seedNodeId: "7"
      seedField: seed
      promptNodeId: ip
      promptField: value
      subjectText:
        nodeId: tg
        field: value
      referenceText:
        nodeId: tc
        field: value
      planResolution:
        nodeId: "7"
        field: resolution

    # Mode "remove": the masked area is regenerated as the surrounding scene.
    objectSwapRemove:
      path: ./workflows/comfyui_video_object_swap_remove_API.json
      description: "When to use it: take an object out of a clip."
      outputExt: mp4
      videoNodeId: "5"
      videoField: video
      seedNodeId: "7"
      seedField: seed
      promptNodeId: ip
      promptField: value
      subjectText:
        nodeId: tg
        field: value
      referenceText:
        nodeId: tc
        field: value
      planResolution:
        nodeId: "7"
        field: resolution

    # Mode "background": the mask is inverted, so the surroundings are redrawn
    # and the tracked subject stays. Takes no photo.
    objectSwapBackground:
      path: ./workflows/comfyui_video_object_swap_background_API.json
      description: "When to use it: replace the setting around the tracked subject of a clip."
      outputExt: mp4
      videoNodeId: "5"
      videoField: video
      seedNodeId: "7"
      seedField: seed
      promptNodeId: ip
      promptField: value
      subjectText:
        nodeId: tg
        field: value
      referenceText:
        nodeId: tc
        field: value
      planResolution:
        nodeId: "7"
        field: resolution

    # Mode "add", described in words: the object is drawn inside the box the
    # user placed, written as JSON keyframes into the placement node.
    objectSwapAdd:
      path: ./workflows/comfyui_video_object_swap_add_API.json
      description: "When to use it: put a new object into a clip, from a sentence."
      outputExt: mp4
      videoNodeId: "5"
      videoField: video
      seedNodeId: "7"
      seedField: seed
      promptNodeId: ip
      promptField: value
      referenceText:
        nodeId: tc
        field: value
      placementText:
        nodeId: pl
        field: value
      planResolution:
        nodeId: "7"
        field: resolution

    # Mode "add" from a photo of the object: chosen instead of objectSwapAdd
    # when the request carries a photo.
    objectSwapAddPhoto:
      path: ./workflows/comfyui_video_object_swap_add_photo_API.json
      description: "When to use it: put the object of a photo into a clip."
      outputExt: mp4
      imageNodeId: "2"
      videoNodeId: "5"
      videoField: video
      seedNodeId: "7"
      seedField: seed
      promptNodeId: ip
      promptField: value
      referenceText:
        nodeId: tc
        field: value
      placementText:
        nodeId: pl
        field: value
      planResolution:
        nodeId: "7"
        field: resolution

    # «Character swap»: Openjutsu's one-click graph. The main person of the clip
    # becomes the one in the photo; Qwen3-VL 8B describes both and writes the
    # shots, SAM 3.1 follows the person, and the graph renders 6 s clips with 39
    # frames of overlap and joins them itself (MiniMaxH3ChainLoopStart), so the
    # whole clip goes in one prompt, lip-sync on (the mouth follows the clip's
    # audio); «Lip-sync» off picks swapPersonNoLipSync below. The line from the
    # chat lands on `ip`, which the graph does not read.
    swapPerson:
      path: ./workflows/comfyui_video_character_swap_API.json
      description: "When to use it: put the person of a photo in place of the main person of a clip, with lip-sync."
      outputExt: mp4
      imageNodeId: "2"
      videoNodeId: "5"
      videoField: video
      seedNodeId: "11"
      seedField: seed
      promptNodeId: ip
      promptField: value
      # «Lip-sync» off runs swapPersonNoLipSync below: this graph has no
      # no_lip_sync switch, so it takes no `noLipSync` pin.
      planResolution:
        nodeId: "11"
        field: resolution

    # The same swap with «Lip-sync» off: Openjutsu's graph as exported, where H3
    # hears silence, the mannequins show the faces and the plan says nobody
    # sings. The lip-sync graph above has none of those nodes.
    swapPersonNoLipSync:
      path: ./workflows/comfyui_video_character_swap_nolipsync_API.json
      description: "When to use it: the same character swap on a clip whose people do not sing or talk."
      outputExt: mp4
      imageNodeId: "2"
      videoNodeId: "5"
      videoField: video
      seedNodeId: "11"
      seedField: seed
      promptNodeId: ip
      promptField: value
      noLipSync:
        nodeId: "68"
        field: value
      planResolution:
        nodeId: "11"
        field: resolution

    # Video upscale (SeedVR2, HD) for clips up to `shortSeconds` long.
    upscaleVideo:
      path: ./workflows/SeedVR2_HD_video_upscale_native.json
      description: "When to use it: raise a short clip to a larger size in one pass."
      outputExt: mp4
      videoNodeId: "1"
      seedNodeId: "10"
      shortSeconds: 10

    # The same for longer clips: a VHS meta-batch chain that ComfyUI requeues
    # once per block of frames.
    upscaleVideoLong:
      path: ./workflows/SeedVR2_HD_video_upscale_native_batched.json
      description: "When to use it: raise a long clip block by block."
      outputExt: mp4
      videoNodeId: "1"
      videoField: video
      seedNodeId: "10"
      metaBatchNodeId: "30"

    # "Regenerate detail" (Open-H3 refiner): lifts the clip's latent with a 3D
    # convolution and redraws it in a few steps. `sizeNodeId` declares the
    # format to the sampler; `upscaleNodeId` receives it as mode.width/height.
    regenerateDetail:
      path: ./workflows/comfyui_video_regenerate_detail_API.json
      description: "When to use it: redraw a clip’s detail at 1.5× without changing the scene."
      outputExt: mp4
      promptNodeId: "10"
      promptField: value
      seedNodeId: "17"
      seedField: noise_seed
      videoNodeId: "1"
      videoField: file
      sizeNodeId: "11"
      upscaleNodeId: "5"

    # ---------------------------------------------------------------- audio

    # Text to music (MiniMax Music 3): caption, lyrics and length pins.
    generateMusic:
      path: ./workflows/audio_minimax_music_3.json
      description: "When to use it: make a song, with or without sung words."
      outputExt: mp3
      promptNodeId: "37:13"
      promptField: caption
      seedNodeId: "37:38"
      seedField: seed
      lyrics:
        nodeId: "37:13"
        field: lyrics
      duration:
        nodeId: "37:13"
        field: max_duration

    # Voice changer (the "voice" action): RVC over the isolated vocal. `voices`
    # lists the RVC model files offered; name the ones installed on your
    # ComfyUI (the list below is a placeholder).
    changeVoice:
      path: ./workflows/audio_voice_rvc_parlato_API.json
      description: "When to use it: sing or speak an existing track with another voice."
      outputExt: mp3
      audioNodeId: "1"
      audioField: audio
      voice:
        nodeId: "4"
        field: model
      pitch:
        nodeId: "6"
        field: pitch
      voices:
        - voice-model.pth

    # Internal step: isolates a track's vocal, which the singing clip listens
    # to (the full mix still goes over the video).
